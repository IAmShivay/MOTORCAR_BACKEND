apiVersions: apps/v1
kind: deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLables:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
    ports:
      - containersPort: 3000
    envFrom:
        - configMapRef:
            name: backend-config
    resources:
      request:
      cpu: "500m"
      memory: "512Mi"
limits:
  cpu: "1"
  memory: "1Gi"
