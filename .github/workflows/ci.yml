name: CI - Build & Test

on:
  workflow_dispatch:
    inputs:
      enviroment:
        description: Choose Enviroment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
          - qa
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "dev", "release/*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up node js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Package
        run: npm install

      - name: Run Tests
        run: npm run test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      PROJECT_ID: my-gcp-project-id
      REPO: my-artifact-repo
      IMAGE: my-app

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/head/dev' ||
      github.ref == 'refs/head/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - name: Auth To Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: decdc
          service_account: github-ci@PROJECT_ID.iam.gserviceaccount.com
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev
      - name: Build & Push Docker image
        run:
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$GITHUB_SHA .
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$GITHUB_SHA
      - name: Select Enviroment
        id: env
        run: |
          if [["${GITHUB_REF}"=="refs/heads/dev" ]]; then
           echo "env=dev" >> $GITHUB_OUTPUT
          elif [["${GITHUB_REF}"=="refs/heads/main" ]]
           echo "env=prod" >> $GITHUB_OUTPUT
          else
           echo "env=qa" >> $GITHUB_OUTPUT
          fi
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials backend-${{ steps.env.outputs.env }} \
            --region $REGION

      - name: Deploy using Kustomize
        run: |
          kubectl set image deployment/backend \
            backend=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$GITHUB_SHA

          kubectl rollout status deployment/backend
