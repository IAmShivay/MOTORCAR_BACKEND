version: '3.9'
services:
  backend-dev:
    profiles: [ "dev" ]
    build: .
    container_name: motor_backend
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped
    command: npm run dev
  backend-prod:
    profiles: [ "prod" ]
    build: .
    container_name: motor_backend_prod
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: always
    command: npm start
  mongo:
   image: mongo:6
   container_name: db_mongo
   ports:
    - "27017:27017"
   volumes:
    - mongo_data:/data/db
   restart: unless-stopped
volumes:
  mongo_data:
